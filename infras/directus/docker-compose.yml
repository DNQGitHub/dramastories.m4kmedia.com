services:
  directus:
    image: directus/directus:11.12.0
    container_name: directus
    restart: unless-stopped

    ports:
      - "${DIRECTUS_PORT}:8055"

    env_file:
      - .env

    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./snapshots:/directus/snapshots

    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
